/* Site kit for these four builds. The lot runs from -2 to 2 on x and z; the camera looks at the +x/+z corner.
   Everything tagged here (crane, plant, cabins, hoarding, scaffold, crew…) leaves the site in a removal step. */
const STEEL = '#7c838b', CONC = '#a7a6a1', VEST = '#ff7a1a', HAT = '#f5f5f0', YEL = '#f2b705';
const T = (tag, o = {}) => Object.assign({ tag }, o);
const wave = (a, f, p = 0) => (a > 0 && a < 1 ? Math.sin(a * f + p) : 0);

function towerCrane(R, id, x, z, h, jib, color = YEL, cable = 1.1) {
  const t = { tag: 'crane' };
  R.group(id, x, 0, z);
  R.box(.5, .12, .5, 0, 0, 0, '#8c8c8c', 'rise', T('crane', { tex: 'concrete' }));
  [[-.11, -.11], [.11, -.11], [-.11, .11], [.11, .11]].forEach(([lx, lz]) => R.box(.035, h, .035, lx, .12, lz, color, 'rise', t));
  for (let y = .45; y < h - .1; y += .45) { R.box(.26, .025, .025, 0, .12 + y, .11, color, 'growX', t); R.box(.025, .025, .26, .11, .12 + y, 0, color, 'growZ', t); }
  R.group(id + 'Top', 0, h + .12, 0);
  R.box(.34, .14, .34, 0, 0, 0, '#3b3f44', 'drop', t);
  R.box(.2, .18, .2, .17, .14, .16, '#f4f4f0', 'drop', T('crane', { glossy: true }));
  R.box(jib, .07, .1, jib / 2, .2, 0, color, 'growX', t);
  R.box(jib - .3, .025, .025, (jib - .3) / 2, .34, 0, color, 'growX', t);
  R.box(1.0, .07, .12, -.5, .2, 0, color, 'growX', t);
  R.box(.3, .22, .22, -.85, .06, 0, '#9a9a96', 'drop', T('crane', { tex: 'concrete' }));
  R.box(.05, .55, .05, 0, .14, 0, color, 'rise', t);
  R.group(id + 'Trolley', jib * .6, .2, 0);
  R.box(.1, .05, .1, 0, -.06, 0, '#3b3f44', 'pop', t);
  R.cyl(.006, .006, cable, 0, -.06 - cable, 0, '#222222', 'hang', t);
  R.box(.24, .1, .24, 0, -.16 - cable, 0, '#c9a06a', 'hang', T('crane', { tex: 'wood' }));
  R.end(); R.end(); R.end();
}
function crawlerCrane(R, id, x, z, ry, boom = 3.2, color = '#d7261e') {
  const t = { tag: 'crane' };
  R.group(id, x, 0, z, { ry });
  R.box(.8, .14, .18, 0, 0, -.22, '#2b2b2b', 'drop', t); R.box(.8, .14, .18, 0, 0, .22, '#2b2b2b', 'drop', t);
  R.group(id + 'Turret', 0, .14, 0);
  R.box(.6, .26, .44, -.05, 0, 0, color, 'drop', t);
  R.box(.2, .2, .18, .2, .26, .14, color, 'drop', t);
  R.box(.2, .3, .44, -.32, .05, 0, '#3b3f44', 'drop', t);
  R.group(id + 'Boom', .22, .22, 0, { rz: 1.0 });
  [[.06, .09], [.06, -.09], [-.06, 0]].forEach(([y, z2]) => R.box(boom, .045, .045, boom / 2, y, z2, color, 'growX', T('crane', { center: true })));
  for (let k = .32; k < boom; k += .32) R.box(.02, .14, .2, k, 0, 0, color, 'pop', T('crane', { center: true }));
  R.group(id + 'Hook', boom, 0, 0, { rz: -1.0 });
  R.cyl(.006, .006, 1.3, 0, -1.3, 0, '#222222', 'hang', t);
  R.box(.55, .06, .07, 0, -1.4, 0, STEEL, 'hang', T('crane', { metal: .6, rough: .4 }));
  R.end(); R.end(); R.end(); R.end();
}
function excavator(R, id, x, z, ry) {
  const t = { tag: 'plant' };

  R.box(.62, .12, .14, 0, 0, -.17, '#2b2b2b', 'drop', t); R.box(.62, .12, .14, 0, 0, .17, '#2b2b2b', 'drop', t);
  R.group(id + 'Turret', 0, .12, 0);
  R.box(.46, .2, .4, -.04, 0, 0, YEL, 'drop', t);
  R.box(.2, .24, .2, .1, .2, -.09, YEL, 'drop', t);
  R.box(.02, .16, .17, .205, .24, -.09, '#9cc9e0', 'pop', T('plant', { glossy: true }));
  R.box(.14, .16, .38, -.26, .02, 0, '#3b3f44', 'drop', t);
  R.group(id + 'Boom', .16, .22, .1, { rz: .6 });
  R.box(.62, .07, .07, .31, 0, 0, YEL, 'growX', T('plant', { center: true }));
  R.group(id + 'Arm', .62, 0, 0, { rz: -1.5 });
  R.box(.46, .05, .05, .23, 0, 0, YEL, 'growX', T('plant', { center: true }));
  R.box(.14, .12, .14, .48, 0, 0, '#3b3f44', 'pop', T('plant', { center: true }));
  R.end(); R.end(); R.end(); R.end();
}
function dumper(R, id, x, z, ry) {
  const t = { tag: 'plant' };
  R.group(id, x, 0, z, { ry });
  [[-.16, -.13], [.16, -.13], [-.16, .13], [.16, .13]].forEach(([wx, wz]) => R.cyl(.075, .075, .06, wx, .075, wz, '#222222', 'pop', T('plant', { rx: Math.PI / 2, center: true })));
  R.box(.46, .08, .24, 0, .08, 0, YEL, 'drop', t);
  R.box(.24, .16, .26, .08, .16, 0, YEL, 'drop', t);
  R.box(.1, .14, .12, -.16, .16, 0, '#3b3f44', 'drop', t);
  R.end();
}
function worker(R, id, x, z, yb = 0, tag = 'crew', vest = VEST) {
  R.group(id, x, yb, z);
  R.cyl(.035, .05, .19, 0, 0, 0, vest, 'rise', T(tag));
  R.sph(.042, 0, .235, 0, '#e8b98f', 'pop', T(tag));
  R.sph(.048, 0, .26, 0, HAT, 'pop', T(tag, { sy: .6 }));
  R.end();
}
function hoarding(R, color = '#e9edf0', withSign = true) {
  const t = { tag: 'hoarding' };
  for (let i = 0; i < 8; i++) if (i !== 5) R.box(.5, .3, .03, -1.95 + i * .53 + .25, 0, 2.12, color, 'rise', t);
  for (let i = 0; i < 8; i++) R.box(.03, .3, .5, 2.12, 0, -1.95 + i * .53 + .25, color, 'rise', t);

}
function lumber(R, x, z, ry, layers = 4, boards = 6, len = 1.1) {

  for (let l = 0; l < layers; l++) for (let b = 0; b < boards; b++) R.box(len, .05, .085, 0, l * .055, -boards * .05 + b * .1, l % 2 ? '#d9b98a' : '#e4c79a', 'drop', T('lumber', { tex: 'wood' }));

function tree(R, x, z, s = 1, leaf = '#3f7d3a') { R.cyl(.03 * s, .045 * s, .4 * s, x, .02, z, '#6b4f3a', 'rise'); R.sph(.22 * s, x, .55 * s, z, leaf, 'pop'); R.sph(.15 * s, x + .1 * s, .7 * s, z - .05, leaf, 'pop'); }
function studs(R, x0, x1, z, y, h, step, along = 'x') {
  const n = Math.round(Math.abs(x1 - x0) / step);
  for (let i = 0; i <= n; i++) { const v = x0 + (x1 - x0) * (i / n); along === 'x' ? R.box(.05, h, .09, v, y, z, '#d9b98a', 'rise', { tex: 'wood' }) : R.box(.09, h, .05, z, y, v, '#d9b98a', 'rise', { tex: 'wood' }); }
  along === 'x' ? (R.box(Math.abs(x1 - x0) + .05, .04, .09, (x0 + x1) / 2, y + h, z, '#cfa874', 'growX', { tex: 'wood' }), R.box(Math.abs(x1 - x0) + .05, .04, .09, (x0 + x1) / 2, y, z, '#cfa874', 'growX', { tex: 'wood' }))
    : (R.box(.09, .04, Math.abs(x1 - x0) + .05, z, y + h, (x0 + x1) / 2, '#cfa874', 'growZ', { tex: 'wood' }), R.box(.09, .04, Math.abs(x1 - x0) + .05, z, y, (x0 + x1) / 2, '#cfa874', 'growZ', { tex: 'wood' }));
}
function scaffoldLift(R, x0, x1, zf, z0, z1, xf, y0, h) {
  const t = { tag: 'scaffold' }, pole = T('scaffold', { metal: .5, rough: .4 }), off = .18;
  for (let i = 0; i <= 5; i++) R.cyl(.012, .012, h, x0 + (x1 - x0) * i / 5, y0, zf + off, '#9aa3ab', 'rise', pole);
  for (let i = 0; i <= 4; i++) R.cyl(.012, .012, h, xf + off, y0, z0 + (z1 - z0) * i / 4, '#9aa3ab', 'rise', pole);
  R.box(x1 - x0, .02, .02, (x0 + x1) / 2, y0 + h - .02, zf + off, '#9aa3ab', 'growX', pole);
  R.box(.02, .02, z1 - z0, xf + off, y0 + h - .02, (z0 + z1) / 2, '#9aa3ab', 'growZ', pole);
  R.box(x1 - x0, .02, .2, (x0 + x1) / 2, y0 + h - .05, zf + off - .1, '#c9a06a', 'growX', T('scaffold', { tex: 'wood' }));
  R.box(.2, .02, z1 - z0, xf + off - .1, y0 + h - .05, (z0 + z1) / 2, '#c9a06a', 'growZ', T('scaffold', { tex: 'wood' }));
  R.box(x1 - x0, .012, .012, (x0 + x1) / 2, y0 + h * .55, zf + off + .02, '#ff7a1a', 'growX', t);
}
function crewLive(parts, a, ids, amp = .3) { ids.forEach((id, i) => { const g = parts[id]; if (!g) return; if (g.userData.x === undefined) { g.userData.x = g.position.x; g.userData.z = g.position.z; } g.position.x = g.userData.x + wave(a, 90 + i * 17, i * 2) * amp; g.position.z = g.userData.z + wave(a, 70 + i * 13, i) * amp * .6; g.rotation.y = wave(a, 45 + i * 9, i) * 2; }); }
function towerLive(parts, a, id, base, jib) { const top = parts[id + 'Top'], tr = parts[id + 'Trolley']; if (top) top.rotation.y = base + wave(a, 34) * 1.2; if (tr) tr.position.x = jib * (.4 + .25 * (wave(a, 57, 1) + 1)); }

  scenes: [
    { code: 'SITE 01', name: 'Timber-frame home', blurb: 'A two-storey family home: stick-framed, sheathed and sided by our carpentry crew.', days: 180, ground: { color: '#7a5c40', tex: 'concrete' }, build(R) {
      R.step('Lot staked out', 'Staking out the lot', '#ff7a1a'); [[-1.6, -1.5], [1.2, -1.5], [-1.6, .6], [1.2, .6]].forEach(([x, z]) => R.cyl(.015, .015, .28, x + (x < 0 ? -.12 : .12), 0, z + (z < 0 ? -.12 : .12), '#ff7a1a', 'rise', T('stakes'))); R.box(3.04, .01, .01, -.2, .2, .72, '#ff7a1a', 'growX', T('stakes')); R.box(.01, .01, 2.34, 1.32, .2, -.45, '#ff7a1a', 'growZ', T('stakes'));
      R.step('Foundation', 'Pouring the foundation', CONC); R.box(2.8, .35, .12, -.2, 0, .54, CONC, 'rise', { tex: 'concrete' }); R.box(2.8, .35, .12, -.2, 0, -1.44, CONC, 'rise', { tex: 'concrete' }); R.box(.12, .35, 2.1, -1.54, 0, -.45, CONC, 'rise', { tex: 'concrete' }); R.box(.12, .35, 2.1, 1.14, 0, -.45, CONC, 'rise', { tex: 'concrete' }); R.box(2.56, .3, 1.86, -.2, 0, -.45, '#9b9a95', 'rise', { tex: 'concrete' });
      R.step('Lumber delivered', 'Dropping the lumber', '#e4c79a'); lumber(R, -.9, 1.45, 0); lumber(R, .55, 1.55, .25, 3, 6, 1.2); worker(R, 'h1', 1.6, 1.0); worker(R, 'h2', -1.7, 1.2);
      R.step('Subfloor', 'Gluing down the subfloor', '#cfa874'); R.box(2.8, .05, 2.1, -.2, .35, -.45, '#cfa874', 'growX', { tex: 'wood' });

      R.step('Roof deck & gables', 'Closing in the roof', '#c9a066'); R.box(3.0, .03, 1.36, -.2, 2.72, .14, '#c9a066', 'growX', { center: true, rx: .514, tex: 'wood' }); R.box(3.0, .03, 1.36, -.2, 2.72, -1.04, '#c9a066', 'growX', { center: true, rx: -.514, tex: 'wood' }); [-1.65, 1.25].forEach((x) => R.cyl(1.212, 1.212, .05, x, 2.566, -.45, '#e6e8e6', 'pop', { seg: 3, center: true, rx: -Math.PI / 2, rz: Math.PI / 2, sz: .357 }));
