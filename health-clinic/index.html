<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WellCare Clinic</title>
<meta name="description" content="Cartoon 3D scroll template for a health clinic: reception, exam room, physio room and dental chair build themselves as you scroll.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Nunito:wght@400;700&family=Space+Mono&display=swap">
<link rel="stylesheet" href="../engine/scenes.css">
<style>
:root {
  --paper: #f2fbf8; --sheet: #ffffff; --ink: #12302a; --ink-2: #355750; --ink-3: #577871; --line: #d6efe7; --line-2: #afd9cb;
  --accent: #179c7a; --accent-ink: #ffffff; --accent-text: #0e7a5f; --pat: rgb(18 48 42 / .10);
  --display: 'Quicksand', ui-rounded, system-ui, sans-serif; --body: 'Nunito', ui-rounded, system-ui, sans-serif; --mono: 'Space Mono', ui-monospace, monospace;
  --radius: 20px; --bw: 2.5px; --hard: 3px; --h-weight: 700; --h-track: -0.02em;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #0b201b; --sheet: #123029; --ink: #eafaf5; --ink-2: #b8dbd1; --ink-3: #87b0a5; --line: #1c3d35; --line-2: #2a564b; --accent-text: #5ad8b4; --pat: rgb(234 250 245 / .07); color-scheme: dark; } }
:root[data-theme="dark"] { --paper: #0b201b; --sheet: #123029; --ink: #eafaf5; --ink-2: #b8dbd1; --ink-3: #87b0a5; --line: #1c3d35; --line-2: #2a564b; --accent-text: #5ad8b4; --pat: rgb(234 250 245 / .07); color-scheme: dark; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
window.SCENES = {
  key: 'clinic', look: 'clay', layout: 'U', assembly: 'grow', speed: 'smooth', saturation: .9, quality: 'medium', base: 'round', pattern: 'dots', unit: 'Room', meterLabel: 'Ready',
  brand: { name: 'WellCare Clinic', mark: 'WC' },
  three: { ghost: ['#179c7a', '#7fe3c5'], plinth: ['#d7f0e7', '#1c3d35'], plinthSide: ['#a8dccb', '#132c26'], outline: '#12302a' },
  intro: { kicker: 'Family care · physio · dental · check-ups', title: 'Care that listens.', highlight: 2, lede: 'Scroll down and each room gets ready for your visit, piece by piece. Scroll back up and it is early morning, before the first patient.' },
  outro: { kicker: 'Room by room', title: 'Ready when you are.', lede: 'Same steps, in plain text. A calm visit starts with a ready room.' },
  scenes: [
    { code: 'RM-1', name: 'Reception', blurb: 'A friendly desk, comfy chairs and water while you wait.', build(R) {
      R.step('Walls & floor', 'Opening the doors', '#d3f1e6'); R.walls('#d3f1e6', { h: 2.2 }); R.tiles(4, '#f6fbf9', '#e6f5ef');
      R.step('Front desk', 'Setting up the desk', '#ffffff'); R.box(2.2, .95, .55, .3, .03, -1.45, '#ffffff', 'rise'); R.box(2.3, .06, .65, .3, .98, -1.45, '#179c7a', 'drop');
      R.step('Welcome sign', 'Hanging the sign', '#179c7a'); R.sign('WELCOME', 1.6, .38, .3, 1.55, -1.97, '#179c7a', '#ffffff', 'pop');
      R.step('Receptionist', 'Greeting the first patient', '#ff8a7a'); R.figure(.3, -1.85, '#ff8a7a', '#c68b59', { hair: '#2b1d14', s: .9 });
      R.step('Waiting chairs', 'Lining up chairs', '#ffb38a'); [[-1.5, -.4], [-1.5, .3], [-1.5, 1.0]].forEach(([x, z]) => R.chair(x, z, Math.PI / 2, '#ffb38a', '#12302a', .9));
      R.step('Water cooler', 'Filling the cooler', '#7fd3ff'); R.box(.35, .9, .35, 1.5, .03, .3, '#ffffff', 'rise'); R.cyl(.14, .14, .4, 1.5, .93, .3, '#7fd3ff', 'drop', { opacity: .6 });
      R.step('Clock & plant', 'Finishing touches', '#4f9d5a'); R.cyl(.25, .25, .04, -1.97, 1.6, -1.0, '#ffffff', 'pop', { rz: Math.PI / 2, center: true }); R.box(.02, .18, .02, -1.94, 1.66, -1.0, '#12302a', 'pop'); R.plant(1.5, 1.3, 1.2, .03, '#ffb38a');
    } },
    { code: 'RM-2', name: 'Exam room', blurb: 'A fresh table, a clean sink and everything sterilised.', build(R) {
      R.step('Walls & floor', 'Cleaning the room', '#e2f4fb'); R.walls('#e2f4fb', { h: 2.2 }); R.slab('#f6fbf9');
      R.step('Exam table', 'Setting up the table', '#179c7a'); R.box(.7, .6, 1.7, .3, .03, -.5, '#ffffff', 'rise'); R.box(.75, .12, 1.75, .3, .63, -.5, '#179c7a', 'drop'); R.box(.6, .12, .4, .3, .75, -1.25, '#179c7a', 'drop', { rx: -.4 });
      R.step('Paper roll', 'Rolling out fresh paper', '#ffffff'); R.cyl(.08, .08, .7, .3, .85, -1.45, '#ffffff', 'pop', { rz: Math.PI / 2, center: true }); R.box(.55, .01, 1.5, .3, .76, -.45, '#ffffff', 'growZ');
      R.step('Cabinet & sink', 'Stocking the cabinet', '#ffffff'); R.box(1.0, .85, .5, -1.0, .03, -1.72, '#ffffff', 'rise'); R.box(1.05, .05, .55, -1.0, .88, -1.72, '#ffb38a', 'drop'); R.cyl(.15, .12, .05, -1.0, .93, -1.7, '#d7eef7', 'pop'); R.cyl(.02, .02, .22, -1.0, .93, -1.9, '#c9ced3', 'rise');
      R.step('Blood pressure monitor', 'Mounting the monitor', '#12302a'); R.box(.3, .25, .08, -1.96, 1.4, -.2, '#12302a', 'pop'); R.box(.02, .14, .2, -1.91, 1.43, -.2, '#5ad8b4', 'pop', { emissive: '#5ad8b4', ei: .9 });
      R.step('Eye chart', 'Hanging the eye chart', '#ffffff'); R.sign('E  F P  T O Z', .5, .8, -1.97, 1.0, .9, '#ffffff', '#12302a', 'pop', { face: 'x' });
      R.step('Doctor', 'Doctor is in', '#ffffff'); R.figure(1.2, .5, '#ffffff', '#e8b98f', { hair: '#7a4b2a' }); R.torus(.1, .015, 1.2, .62, .67, '#12302a', 'pop'); R.cyl(.18, .2, .04, 1.2, .5, 1.3, '#179c7a', 'pop');
    } },
    { code: 'RM-3', name: 'Physio room', blurb: 'A treatment bed, bands in every colour and room to move.', build(R) {
      R.step('Walls & floor', 'Opening up', '#fff1e6'); R.walls('#fff1e6', { h: 2.2 }); R.planks(6, '#e6c9a8', '#dcbd99', { tex: 'wood' });
      R.step('Treatment bed', 'Setting up the bed', '#179c7a'); R.box(.75, .6, 1.8, -.9, .03, -.6, '#ffffff', 'rise'); R.box(.8, .12, 1.85, -.9, .63, -.6, '#179c7a', 'drop');
      R.step('Exercise mat', 'Rolling out the mat', '#ffb38a'); R.box(.8, .02, 1.6, .7, .04, .5, '#ffb38a', 'growZ');
      R.step('Exercise ball', 'Pumping up the ball', '#5ad8b4'); R.sph(.35, 1.4, .38, -1.2, '#5ad8b4', 'drop');
      R.step('Band rack', 'Hanging the bands', '#ff8a7a'); R.box(1.2, .06, .1, .3, 1.6, -1.95, '#12302a', 'growX'); ['#ff8a7a', '#ffd166', '#5ad8b4', '#7a9cff', '#c38cff'].forEach((c, i) => R.cyl(.02, .02, .6, -.1 + i * .2, 1.0, -1.92, c, 'hang'));
      R.step('Foam roller', 'Adding the foam roller', '#7a9cff'); R.cyl(.1, .1, .6, .7, .14, 1.1, '#7a9cff', 'pop', { rz: Math.PI / 2, center: true });
      R.step('Physio', 'Physio ready', '#179c7a'); R.figure(.2, -.4, '#179c7a', '#c68b59', { hair: '#1b1b1f' });
    } },
    { code: 'RM-4', name: 'Dental', blurb: 'A chair that tilts just right, a bright lamp and gentle hands.', build(R) {
      R.step('Walls & floor', 'Cleaning the room', '#e2f4fb'); R.walls('#e2f4fb', { h: 2.2 }); R.tiles(4, '#f6fbf9', '#e6f5ef');
      R.step('Chair base', 'Bolting the base', '#c9ced3'); R.cyl(.35, .4, .1, .2, .03, -.3, '#c9ced3', 'pop'); R.cyl(.12, .12, .3, .2, .13, -.3, '#c9ced3', 'rise');
      R.step('Dental chair', 'Fitting the chair', '#179c7a'); R.box(.6, .14, .7, .2, .45, -.3, '#179c7a', 'drop'); R.box(.6, .12, .8, .2, .7, -.95, '#179c7a', 'drop', { rx: .8 }); R.box(.6, .12, .6, .2, .38, .35, '#179c7a', 'drop', { rx: -.35 }); R.box(.3, .1, .2, .2, 1.18, -1.32, '#179c7a', 'drop', { rx: .8 });
      R.step('Light arm', 'Positioning the lamp', '#ffffff'); R.cyl(.03, .03, 2.2, -.6, .03, -1.6, '#c9ced3', 'rise'); R.box(.9, .05, .05, -.15, 2.1, -1.2, '#c9ced3', 'growX', { ry: .6 }); R.box(.3, .1, .2, .25, 1.9, -.9, '#ffffff', 'hang'); R.box(.22, .02, .14, .25, 1.89, -.9, '#fff7d6', 'hang', { emissive: '#fff1b8', ei: 1.4 });
      R.step('Instrument tray', 'Laying out instruments', '#c9ced3'); R.box(.5, .03, .35, 1.0, .9, -.4, '#c9ced3', 'pop'); R.cyl(.02, .02, .9, 1.0, 0, -.4, '#c9ced3', 'rise'); for (let i = 0; i < 4; i++) R.box(.02, .01, .22, .85 + i * .1, .93, -.4, '#7a8a96', 'pop');
      R.step('Screen', 'Turning on the screen', '#12302a'); R.box(.04, .45, .7, -1.96, 1.3, .6, '#12302a', 'pop'); R.box(.02, .36, .6, -1.93, 1.32, .6, '#7fe3c5', 'pop', { emissive: '#5ad8b4', ei: .8 });
      R.step('Dentist', 'Dentist ready', '#7a9cff'); R.figure(1.1, .6, '#7a9cff', '#e8b98f', { hair: '#3b2a1e' }); R.sph(.08, 1.1, .78, .73, '#cfe8ff', 'pop', { sy: .6 });
    } },
  ],
};
</script>
<script src="../engine/scenes.js"></script>
</body>
</html>
